name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json

      - name: Resolve dependency lock
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Install from lock
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Service worker syntax
        run: node --check client/public/sw.js

      - name: Typecheck
        run: npm run check

      - name: Server tests
        run: npm run test:server

      - name: Client library tests
        run: npm run test:client-lib

      - name: Client component tests
        run: npm run test:client-components

      - name: Stations page UI test
        run: npm run test:client-stations-page

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E + accessibility
        run: npm run test:e2e
