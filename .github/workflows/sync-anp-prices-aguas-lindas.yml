name: Sync ANP preços Águas Lindas

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-anp-prices-aguas-lindas.mjs"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anp-precos-aguas-lindas
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Sincronizar preços ANP
        run: npm run sync:anp:precos:aguas-lindas

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain -- client/public/data/aguas-lindas-anp-precos.json)" ]; then
            echo "Preços ANP sem alterações."
            exit 0
          fi
          git config user.name "trajeto-anp-price-sync"
          git config user.email "actions@users.noreply.github.com"
          git add client/public/data/aguas-lindas-anp-precos.json
          git commit -m "data: sync preços ANP Águas Lindas"
          git push
