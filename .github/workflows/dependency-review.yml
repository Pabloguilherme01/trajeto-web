name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    # The action requires GitHub Dependency Graph to be enabled. Keep the
    # workflow from failing solely because the repository capability is off.
    if: ${{ github.event.repository.security_and_analysis.dependency_graph.status == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only,GPL-3.0-only,AGPL-1.0-only,AGPL-3.0-only
