name: Deploy Trajeto to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /trajeto-web/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json


      - name: Install from lock
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Sync ANP snapshot for Pages
        shell: bash
        run: |
          set -euo pipefail
          if npm run sync:anp:aguas-lindas; then
            echo "Snapshot ANP atualizado para o build."
          elif [ -f client/public/data/aguas-lindas-anp.json ]; then
            echo "ANP indisponível agora; usando snapshot existente."
          else
            echo "ANP indisponível e sem snapshot; o build segue com o diretório local e cache do aparelho."
          fi

      - name: Sync ANP station prices for Pages
        shell: bash
        run: |
          set -euo pipefail
          if npm run sync:anp:precos:aguas-lindas; then
            echo "Snapshot de preços ANP atualizado para o build."
          elif [ -f client/public/data/aguas-lindas-anp-precos.json ]; then
            echo "ANP preços indisponível agora; usando snapshot existente."
          else
            echo "ANP preços indisponível e sem snapshot; o build segue sem preço individual."
          fi

      - name: Build static client
        run: npm run build:client

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -f dist/public/site.webmanifest
          test -f dist/public/robots.txt
          test -f dist/public/favicon.svg
          test -f dist/public/icon-192.png
          test -f dist/public/icon-512.png
          test -f dist/public/icon-512-maskable.png
          test -f dist/public/icon-1024.png
          test -f dist/public/.vite/manifest.json
          cp dist/public/index.html dist/public/404.html
          echo "GitHub Pages artifact validated."

      - name: Validate mobile offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/sw.js
          node --check dist/public/sw.js
          test -f dist/public/site.webmanifest
          test -f dist/public/favicon.svg
          test -f dist/public/icon-192.png
          test -f dist/public/icon-512.png
          test -f dist/public/icon-512-maskable.png
          test -f dist/public/.vite/manifest.json
          grep -q '"sizes": "192x192"' dist/public/site.webmanifest
          grep -q '"sizes": "512x512"' dist/public/site.webmanifest
          grep -q '"purpose": "maskable"' dist/public/site.webmanifest
          grep -q '"scope": "./"' dist/public/site.webmanifest
          echo "Mobile/offline assets validated."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
