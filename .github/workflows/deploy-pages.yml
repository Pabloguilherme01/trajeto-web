name: Deploy Trajeto to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /trajeto-web/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check runner toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Sync ANP snapshot for Pages
        shell: bash
        run: |
          set -euo pipefail
          if npm run sync:anp:aguas-lindas; then
            echo "Snapshot ANP atualizado para o build."
          elif [ -f client/public/data/aguas-lindas-anp.json ]; then
            echo "ANP indisponível agora; usando snapshot existente."
          else
            echo "ANP indisponível e sem snapshot; o build segue com o diretório local e cache do aparelho."
          fi

      - name: Build static client
        run: npm run build:client

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -f dist/public/site.webmanifest
          test -f dist/public/robots.txt
          test -f dist/public/favicon.svg
          test -f dist/public/.vite/manifest.json
          cp dist/public/index.html dist/public/404.html
          printf '%s\n' "GitHub Pages artifact validated."

      - name: Validate mobile offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/sw.js
          test -f dist/public/site.webmanifest
          test -f dist/public/favicon.svg
          test -f dist/public/.vite/manifest.json
          grep -q 'scope' dist/public/site.webmanifest
          printf '%s\n' "Mobile/offline assets validated."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
