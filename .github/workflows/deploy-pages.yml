name: Deploy Trajeto to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /trajeto-web/
      VITE_STATIC_RUNTIME: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json


      - name: Install from lock
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund


      - name: Configure public runtime\n        env:\n          PUBLIC_API_BASE: ${{ secrets.VITE_API_BASE_URL }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [ -n "$PUBLIC_API_BASE" ]; then\n            echo "VITE_API_BASE_URL=$PUBLIC_API_BASE" >> "$GITHUB_ENV"\n            echo 'VITE_STATIC_RUNTIME=false' >> "$GITHUB_ENV"\n            echo "Public API configured; enabling live planner runtime."\n          else\n            echo 'VITE_STATIC_RUNTIME=true' >> "$GITHUB_ENV"\n            echo "No VITE_API_BASE_URL secret; keeping the self-contained Pages fallback."\n          fi\n\n      - name: Validate committed data snapshots
        shell: bash
        run: |
          set -euo pipefail
          test -f client/public/data/aguas-lindas-anp.json
          test -f client/public/data/aguas-lindas-anp-precos.json
          node -e 'JSON.parse(require("node:fs").readFileSync("client/public/data/aguas-lindas-anp.json","utf8")); JSON.parse(require("node:fs").readFileSync("client/public/data/aguas-lindas-anp-precos.json","utf8"));'

      - name: Build static client
        run: npm run build:client

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -f dist/public/site.webmanifest
          test -f dist/public/robots.txt
          test -f dist/public/favicon.svg
          test -f dist/public/icon-192.png
          test -f dist/public/icon-512.png
          test -f dist/public/icon-512-maskable.png
          test -f dist/public/icon-1024.png
          test -f dist/public/.vite/manifest.json
          cp dist/public/index.html dist/public/404.html
          echo "GitHub Pages artifact validated."

      - name: Validate mobile offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/sw.js
          node --check dist/public/sw.js
          test -f dist/public/site.webmanifest
          test -f dist/public/favicon.svg
          test -f dist/public/icon-192.png
          test -f dist/public/icon-512.png
          test -f dist/public/icon-512-maskable.png
          test -f dist/public/.vite/manifest.json
          grep -q '"sizes": "192x192"' dist/public/site.webmanifest
          grep -q '"sizes": "512x512"' dist/public/site.webmanifest
          grep -q '"purpose": "maskable"' dist/public/site.webmanifest
          grep -q '"scope": "./"' dist/public/site.webmanifest
          echo "Mobile/offline assets validated."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
