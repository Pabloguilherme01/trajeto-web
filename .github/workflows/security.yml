name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json
      - name: Resolve dependency lock
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install production dependencies from lock
        run: npm ci --omit=dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check tracked files for private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- \\.(pem|key|p12|pfx)$ >/dev/null 2>&1; then
            echo "Private-key-like file reference found in tracked content."
            git grep -nEI -- \\.(pem|key|p12|pfx)$
            exit 1
          fi
          if git grep -nE -- "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----" >/dev/null 2>&1; then
            echo "Private key material detected in the repository."
            exit 1
          fi
