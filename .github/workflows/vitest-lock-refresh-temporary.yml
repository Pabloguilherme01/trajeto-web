name: Temporary Vitest lockfile regeneration

on:
  push:
    branches:
      - fix/vitest-4-1-12-security-20261022
    paths:
      - .github/workflows/vitest-lock-refresh-temporary.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Pabloguilherme01/trajeto-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vitest-4-1-12-security-20261022
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate lockfile using official npm registry
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify audit before committing
        run: npm audit --audit-level=moderate
      - name: Commit lockfile only to isolated fix branch
        shell: bash
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(lock): resolve Vitest 4.1.12 from npm registry'
            git push origin HEAD:refs/heads/fix/vitest-4-1-12-security-20261022
          fi
