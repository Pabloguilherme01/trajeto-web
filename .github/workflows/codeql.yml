name: CodeQL

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

      # Temporary PR-local diagnostics: IDs/locations only, no source or secrets.
      - name: Identify the CodeQL alert rule and location for PR 500
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 500
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.resolve(process.env.GITHUB_WORKSPACE, '..', 'results');
          const files = fs.existsSync(directory) ? fs.readdirSync(directory).filter(name => name.endsWith('.sarif')) : [];
          if (!files.length) { console.log('No SARIF result files located at', directory); process.exit(0); }
          for (const name of files) {
            const sarif = JSON.parse(fs.readFileSync(path.join(directory, name), 'utf8'));
            for (const run of sarif.runs || []) {
              const rules = [...(run.tool?.driver?.rules || []), ...(run.tool?.extensions || []).flatMap(e => e.rules || [])];
              const byId = new Map(rules.map(rule => [rule.id, rule]));
              console.log('SARIF summary:', name, 'result count', (run.results || []).length);
              for (const result of run.results || []) {
                const rule = byId.get(result.ruleId) || rules[result.ruleIndex] || {};
                const score = Number(rule.properties?.['security-severity'] ?? NaN);
                if (score < 7 || !Number.isFinite(score)) continue;
                const location = result.locations?.[0]?.physicalLocation || {};
                console.log('CodeQL high finding:', JSON.stringify({rule: result.ruleId, severity: score, file: location.artifactLocation?.uri, line: location.region?.startLine}));
              }
            }
          }
          NODE

  diagnose_main_baseline:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 500
    name: Compare CodeQL baseline without publishing results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout baseline main
        uses: actions/checkout@v7
        with:
          ref: 592a250f507027861879f5986efe3a4b912ed7a5
      - name: Initialize CodeQL baseline
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild baseline
        uses: github/codeql-action/autobuild@v4
      - name: Analyze baseline without upload
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: baseline-results
      - name: Print baseline high finding identifiers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.resolve(process.env.GITHUB_WORKSPACE, 'baseline-results');
          if (!fs.existsSync(dir)) { console.log('Baseline SARIF missing'); process.exitCode = 1; }
          else for (const file of fs.readdirSync(dir).filter(p => p.endsWith('.sarif'))) {
            const data = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            for (const run of data.runs || []) {
              const rules = [...(run.tool?.driver?.rules || []), ...(run.tool?.extensions || []).flatMap(e => e.rules || [])];
              const byId = new Map(rules.map(r => [r.id, r]));
              console.log('BASELINE SARIF count', (run.results || []).length);
              for (const result of run.results || []) {
                const rule = byId.get(result.ruleId) || rules[result.ruleIndex] || {};
                const score = Number(rule.properties?.['security-severity'] ?? NaN);
                if (!Number.isFinite(score) || score < 7) continue;
                const loc = result.locations?.[0]?.physicalLocation || {};
                console.log('BASELINE high:', JSON.stringify({rule: result.ruleId, score, file: loc.artifactLocation?.uri, line: loc.region?.startLine}));
              }
            }
          }
          NODE
