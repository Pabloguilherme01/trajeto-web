name: Sync ANP Águas Lindas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: anp-aguas-lindas
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check pending snapshot PR
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --base main --head automation/anp-snapshot --state open --json number --jq 'length')
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.pending.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        if: steps.pending.outputs.exists != 'true'
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Sincronizar ANP cadastral
        if: steps.pending.outputs.exists != 'true'
        run: node scripts/sync-anp-aguas-lindas.mjs

      - name: Sincronizar preços ANP por posto
        if: steps.pending.outputs.exists != 'true'
        run: node scripts/sync-anp-prices-aguas-lindas.mjs

      - name: Publish snapshot for review
        if: steps.pending.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- client/public/data/aguas-lindas-anp.json client/public/data/aguas-lindas-anp-precos.json)" ]; then
            echo "ANP sem alterações semânticas."
            exit 0
          fi
          git checkout -b automation/anp-snapshot
          git config user.name "trajeto-anp-sync"
          git config user.email "actions@users.noreply.github.com"
          git add client/public/data/aguas-lindas-anp.json client/public/data/aguas-lindas-anp-precos.json
          git commit -m "data: sync ANP Águas Lindas"
          git push --force-with-lease origin HEAD:refs/heads/automation/anp-snapshot
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...automation/anp-snapshot?expand=1"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if pr_url=$(gh pr create --base main --head automation/anp-snapshot --title "Atualizar snapshots ANP de Águas Lindas" --body "Atualização dos dois snapshots oficiais ANP. Validar os checks do PR antes de squash merge; não há push direto nem merge automático na main." 2>"$error_file"); then
            printf '### Snapshot ANP pronto para revisão\n\nPR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' "$error_file"; then
            echo "::warning::Snapshot publicado na branch automation/anp-snapshot. A política do repositório bloqueia a criação automática de PR; revisão manual necessária."
            printf '### Snapshot ANP aguarda abertura de PR\n\nOs dados foram preservados na branch `automation/anp-snapshot`. A política do repositório bloqueia a abertura automática de PR. Nenhuma atualização foi aplicada ao site.\n\n[Abrir comparação e PR](%s)\n' "$compare_url" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$error_file" >&2
            exit 1
          fi
