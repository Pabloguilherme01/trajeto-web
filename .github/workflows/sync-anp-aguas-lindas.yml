name: Sync ANP Águas Lindas

on:
  push:
    branches: [main]
    paths-ignore:
      - "client/public/data/aguas-lindas-anp.json"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anp-aguas-lindas
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sincronizar ANP
        run: node scripts/sync-anp-aguas-lindas.mjs

      - name: Commit snapshot
        run: |
          if git diff --quiet -- client/public/data/aguas-lindas-anp.json; then
            echo "ANP sem alterações."
            exit 0
          fi
          git config user.name "trajeto-anp-sync"
          git config user.email "actions@users.noreply.github.com"
          git add client/public/data/aguas-lindas-anp.json
          git commit -m "data: sync ANP Águas Lindas"
          git push
