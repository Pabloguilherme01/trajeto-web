name: Sync ANP Águas Lindas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anp-aguas-lindas
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sincronizar ANP cadastral
        run: node scripts/sync-anp-aguas-lindas.mjs
      - name: Instalar dependência de leitura de planilha
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Sincronizar preços ANP por posto
        shell: bash
        run: |
          set -euo pipefail
          if npm run sync:anp:precos:aguas-lindas; then
            echo "Snapshot de preços ANP atualizado."
          elif [ -s client/public/data/aguas-lindas-anp-precos.json ]; then
            echo "ANP preços indisponível; snapshot anterior preservado."
          else
            echo "ANP preços indisponível; nenhum preço individual novo foi materializado."
          fi
      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain -- client/public/data/aguas-lindas-anp.json client/public/data/aguas-lindas-anp-precos.json)" ]; then
            echo "ANP sem alterações."
            exit 0
          fi
          git config user.name "trajeto-anp-sync"
          git config user.email "actions@users.noreply.github.com"
          git add client/public/data/aguas-lindas-anp.json client/public/data/aguas-lindas-anp-precos.json
          git commit -m "data: sync ANP Águas Lindas"
          git push
