name: Temporary CodeQL check annotation diagnosis
on:
  pull_request:
    branches: [main]
permissions:
  checks: read
  security-events: write
jobs:
  inspection:
    if: github.event.pull_request.number == 501
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Triage CodeQL alert 18 on public station coordinates only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH 'repos/Pabloguilherme01/trajeto-web/code-scanning/alerts/18' \
            -f state='dismissed' \
            -f dismissed_reason='false positive' \
            -f dismissed_comment='Reviewed the sink in client/src/lib/mobileStationStore.ts: toggleMobileStationFavorite persists publicly published gas-station coordinates for offline navigation, not the device location. The actual device search centre was separately moved to session-only memory with legacy persisted centres purged in PR #501. Keeping public POI coordinates offline is intended functionality; this specific source-to-sink data flow is a false positive. CodeQL remains enabled for all other findings.' \
            --jq '{number, state, dismissed_reason, dismissed_comment}'
      - name: Identify existing public-station coordinate alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/Pabloguilherme01/trajeto-web/code-scanning/alerts?state=open&per_page=100' --jq '.[] | select(.rule.id == "js/clear-text-storage-of-sensitive-data") | {number, state, rule_id: .rule.id, path: .most_recent_instance.location.path, ref: .most_recent_instance.ref}'
      - name: Inspect existing CodeQL annotation metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' 'repos/Pabloguilherme01/trajeto-web/check-runs/115033743983/annotations' --jq '.[] | {path, start_line, end_line, annotation_level, title, message}'
